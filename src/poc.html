<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Imágenes</title>
</head>
<body>
<input accept="image/*"
       id="imageInput"
       multiple
       type="file">
<div>
    <button id="prevButton">Anterior</button>
    <button id="nextButton">Siguiente</button>
    <button id="presentButton">Presentar</button>
</div>
<script>
    const elements = {
        imageInput: document.getElementById('imageInput'),
        prevButton: document.getElementById('prevButton'),
        nextButton: document.getElementById('nextButton'),
        presentButton: document.getElementById('presentButton'),
    };

    let images = [];
    let currentIndex = 0;
    const worker = initializeWorker('sharedWorker.js');

    elements.imageInput.addEventListener('change', handleImageChange);
    elements.prevButton.addEventListener('click', () => navigateImage(-1));
    elements.nextButton.addEventListener('click', () => navigateImage(1));
    elements.presentButton.addEventListener('click', openPresenter);

    function handleImageChange(e) {
        images = Array.from(e.target.files);
        currentIndex = 0;
        updateWorker();
    }

    function navigateImage(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < images.length) {
            currentIndex = newIndex;
            updateWorker();
        }
    }

    function openPresenter() {
        window.open('presenter.html');
        updateWorker();
    }
</script>
</body>
</html>
