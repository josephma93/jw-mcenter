<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jehovah Witnesses Multimedia Center - Ventana de presentación</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Media container fills the viewport */
    #media-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Images and videos stay within the viewport without cropping */
    #media-container img,
    #media-container video {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Audio elements use default sizing */
    #media-container audio {
      max-width: 100%;
    }

    /* Fullscreen overlay styling */
    #fullscreen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      text-align: center;
      cursor: pointer;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    /* Simple status message styling */
    #statusMessage {
      position: absolute;
      top: 10px;
      left: 10px;
      display: none;
      color: white;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body data-testid="page:presenter">
  <!-- Empty until the control panel sends media; the app must work offline. -->
  <div id="media-container" data-testid="state:presenter-media"></div>
  <div id="fullscreen-overlay" data-testid="state:fullscreen-prompt">Haz clic para pantalla completa</div>
  <div id="statusMessage" data-testid="state:presenter-status"></div>
  <script type="module" src="./js/presentation.js"></script>
</body>

</html>
